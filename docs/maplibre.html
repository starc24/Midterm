<!DOCTYPE html>
<html>
<head>
    <title>My Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@^6.10.0/dist/maplibre-gl.css" />
    <style>
        body { margin: 0; }
        #map { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script type="module">
    // Customizations:
    // 1. color
    // 2. angle
    // 3.popup
        import * as maplibregl from 'https://unpkg.com/maplibre-gl@^6.10.0/dist/maplibre-gl.mjs';

      
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/positron',
            center: [-106.018066, 34.307144],
            zoom: 6,
            pitch: 50,
            bearing: 10
        });
        window.map = map;   // exposes map to the browser console for debugging

       
        map.on('load', function () {
            map.addControl(new maplibregl.NavigationControl(), 'top-left');
        
         map.addControl(new maplibregl.ScaleControl(), 'bottom-left');
        });

       
        map.on('load', () => {
            map.addSource('county_pop', {
                type: 'geojson',
                data: 'data/popul_byco2018.geojson'
            });

            map.addLayer({
                id: 'county_pop', type: 'fill', source: 'county_pop',
                paint: { 'fill-color': '#1AD68B', 'fill-opacity': 0.4 }
            });

            map.addLayer({
                id: 'county_lines', type: 'line', source: 'cowntee_NA',
                paint: {'line-color': '#1A65D6', 'line-width': 3}
            });

        // TODO: Update the correct popup fields
        map.on('click', 'cowntee_NA', function (e) {
                new maplibregl.Popup()
                    .setLngLat(e.lngLat)
                    .setHTML(`Name: cowntee_NA ${e.features[0].properties.name}<br>
                    Population: ${e.features[0].properties.population}`)
                    .addTo(map);
            });
        });
    </script>
</body>
</html>
